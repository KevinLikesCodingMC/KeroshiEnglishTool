{% load static %}
<!doctype html>
<html lang="zh-CN">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>选择词义</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<script src="{% static 'vocabulary/meaning.js' %}?v=20261105-2" defer></script>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
</head>
<body>

<main id="quiz" class="container py-4 py-md-5" data-questions-url="{% url 'vocabulary:questions' %}">
	<div class="row justify-content-center">
		<div class="col-12 col-lg-8 col-xl-7">

			<header class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-4">
				<h1 class="h3 mb-0">选择词义</h1>
				<nav class="nav nav-underline" role="tablist" aria-label="练习模式">
					<button id="practice-tab" class="nav-link active" data-bs-toggle="tab" data-bs-target="#practice" type="button" role="tab" aria-controls="practice" aria-selected="true">随机练习</button>
					<button id="mistakes-tab" class="nav-link" data-bs-toggle="tab" data-bs-target="#mistakes" type="button" role="tab" aria-controls="mistakes" aria-selected="false">错题本</button>
				</nav>
			</header>

			<div class="tab-content">

				<div id="practice" class="tab-pane show active" role="tabpanel" aria-labelledby="practice-tab" tabindex="0">
					<p id="status" class="text-body-secondary" role="status" aria-live="polite">正在加载题目……</p>
					<button id="retry" type="button" class="btn btn-outline-primary mb-4" hidden>重新加载</button>
					<section id="question" aria-label="词义选择题" hidden>
						<h2 id="word" class="fs-4 mb-2 text-break focus-ring focus-ring-light" lang="en" tabindex="-1"></h2>
						<p id="phonetic" class="text-body-secondary mb-4"></p>
						<div id="choices" class="row g-2" role="group" aria-label="四个中文释义"></div>
						<button id="next" type="button" class="btn btn-primary mt-4" hidden>下一题</button>
					</section>
					<div id="empty" class="alert alert-warning" role="status" hidden>
						<h2 class="h5">暂时没有足够的题目</h2>
					</div>
				</div>

				<div id="mistakes" class="tab-pane" role="tabpanel" aria-labelledby="mistakes-tab" tabindex="0">
					<div class="d-flex justify-content-between align-items-center mb-3">
						<span id="mistakes-count" class="text-body-secondary"></span>
						<button id="review-start" class="btn btn-outline-primary btn-sm" type="button" hidden>开始复习</button>
					</div>
					<button id="review-back" class="btn btn-link btn-sm px-0 mb-3" type="button" hidden>返回列表</button>
					<p id="storage-status" class="small text-body-secondary" role="status"></p>
					<div id="mistakes-list" class="list-group list-group-flush"></div>
					<div id="review-host"></div>
				</div>

			</div>

			<noscript><p class="alert alert-warning">请启用 JavaScript 以加载题目。</p></noscript>
		</div>
	</div>
</main>

</body>
</html>
