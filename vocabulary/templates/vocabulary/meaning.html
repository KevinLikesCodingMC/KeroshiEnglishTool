{% load static %}
<!doctype html>
<html lang="zh-CN">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>选择词义</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<script src="{% static 'vocabulary/meaning.js' %}" defer></script>
</head>
<body>
	<main id="quiz" class="container py-5" style="max-width: 720px;" data-questions-url="{% url 'vocabulary:questions' %}">
		<h1 class="h3 mb-4">选择词义</h1>
		<p id="status" role="status" aria-live="polite">正在加载题目……</p>
		<button id="retry" type="button" class="btn btn-outline-primary mb-4" hidden>重新加载</button>
		<a id="login" class="btn btn-outline-primary mb-4" href="{% url 'admin:login' %}?next={% url 'vocabulary:index' %}" hidden>重新登录</a>
		<section id="question" aria-label="词义选择题" hidden>
			<h2 id="word" class="fs-4 mb-2 text-break" lang="en" tabindex="-1" style="outline: none;"></h2>
			<p id="phonetic" class="text-body-secondary mb-4"></p>
			<div id="choices" class="row g-2" role="group" aria-label="四个中文释义"></div>
			<button id="next" type="button" class="btn btn-primary mt-4" hidden>下一题</button>
		</section>
		<div id="empty" class="alert alert-warning" role="status" hidden>
			<h2 class="h5">暂时没有足够的题目</h2>
		</div>
		<noscript><p class="alert alert-warning">请启用 JavaScript 以加载题目。</p></noscript>
	</main>
</body>
</html>
