<!doctype html>
<html lang="zh-CN">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>听力音频</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
	<main class="container py-5" style="max-width: 720px;">
		<h1 class="h3 mb-4">听力音频</h1>

		<form id="tts-form" data-create-url="{% url 'listening:job-create' %}">
			{% csrf_token %}
			<label for="text" class="form-label">英文文本</label>
			<textarea id="text" name="text" class="form-control mb-3" rows="6" required autofocus></textarea>
			<label for="speed" class="form-label">
				语速：<span id="speed-value">1.0×</span>
			</label>
			<input
				type="range" id="speed" name="speed"
				class="form-range mb-3"
				min="0.5" max="2.0" step="0.1" value="1.0"
				oninput="document.getElementById('speed-value').textContent = Number(this.value).toFixed(1) + '×'"
			>
			<button id="submit-button" type="submit" class="btn btn-primary w-100">生成</button>
		</form>

		<div id="status-message" class="alert mt-4 mb-0 d-none" role="status"></div>
		<audio id="audio-player" class="w-100 mt-4 d-none" controls preload="metadata"></audio>
	</main>

	<script>
		const form = document.getElementById("tts-form");
		const textInput = document.getElementById("text");
		const speedInput = document.getElementById("speed");
		const submitButton = document.getElementById("submit-button");
		const statusMessage = document.getElementById("status-message");
		const audioPlayer = document.getElementById("audio-player");
		const csrfToken = form.querySelector("[name=csrfmiddlewaretoken]").value;
		let pollTimeout = null;

		function showStatus(message, type) {
			statusMessage.textContent = message;
			statusMessage.className = `alert alert-${type} mt-4 mb-0`;
		}

		function stopPolling() {
			if (pollTimeout !== null) {
				clearTimeout(pollTimeout);
				pollTimeout = null;
			}
		}

		async function pollJob(statusUrl) {
			try {
				const response = await fetch(statusUrl, {
					headers: {"Accept": "application/json"},
				});
				const data = await response.json();

				if (! response.ok) {
					throw new Error(data.error || "查询任务失败。");
				}

				if (data.status === "completed") {
					showStatus("完成。", "success");
					audioPlayer.src = data.audio_url;
					audioPlayer.classList.remove("d-none");
					submitButton.disabled = false;
					return;
				}

				if (data.status === "failed") {
					showStatus(`生成失败：${data.error_message}`, "danger");
					submitButton.disabled = false;
					return;
				}

				showStatus("生成中……", "info");
				pollTimeout = setTimeout(() => pollJob(statusUrl), 2000);
			} catch (error) {
				showStatus(error.message, "danger");
				submitButton.disabled = false;
			}
		}

		form.addEventListener("submit", async (event) => {
			event.preventDefault();
			stopPolling();
			submitButton.disabled = true;
			audioPlayer.pause();
			audioPlayer.removeAttribute("src");
			audioPlayer.classList.add("d-none");

			try {
				const response = await fetch(form.dataset.createUrl, {
					method: "POST",
					headers: {
						"Accept": "application/json",
						"Content-Type": "application/json",
						"X-CSRFToken": csrfToken,
					},
					body: JSON.stringify({
						text: textInput.value,
						speed: Number(speedInput.value),
					}),
				});
				const data = await response.json();

				if (!response.ok) {
					throw new Error(data.error || "创建任务失败。");
				}

				showStatus("生成中……", "info");
				pollTimeout = setTimeout(() => pollJob(data.status_url), 2000);
			} catch (error) {
				showStatus(error.message, "danger");
				submitButton.disabled = false;
			}
		});
	</script>
</body>
</html>
