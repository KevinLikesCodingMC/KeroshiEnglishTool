{% load static %}
<!doctype html>
<html lang="zh-CN">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>听力材料</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
	<main class="container py-5" style="max-width: 720px;">

		<h1 class="h3 mt-4">生成听力材料</h1>

		<form id="material-form" data-create-url="{% url 'listening:material-create' %}">
			{% csrf_token %}
			<label for="topic" class="form-label">主题或场景</label>
			<textarea id="topic" class="form-control mb-3" rows="3" maxlength="500" required></textarea>
			<div class="row mb-3">
				<div class="col-sm-6 mb-3">
					<label for="level" class="form-label">难度（CEFR）</label>
					<select id="level" class="form-select">
						<option>A1</option>
						<option>A2</option>
						<option selected>B1</option>
						<option>B2</option>
						<option>C1</option>
						<option>C2</option>
					</select>
				</div>
				<div class="col-sm-6">
					<label for="word-count" class="form-label">目标词数（约）</label>
					<input id="word-count" type="number" class="form-control" min="50" max="800" step="1" value="200" required>
				</div>
			</div>
			<button id="generate-button" class="btn btn-primary w-100" type="submit">生成材料</button>
		</form>
		<p id="material-status" class="mt-3" role="status" aria-live="polite"></p>
		<section id="material-result" class="d-none">
			<label for="material-text" class="form-label">英文原文（可编辑）</label>
			<textarea id="material-text" class="form-control mb-3" rows="14"></textarea>
		</section>
	</main>
	<script src="{% static 'listening/materials.js' %}" defer></script>
</body>
</html>
