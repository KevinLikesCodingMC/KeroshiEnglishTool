{% load static %}
<!doctype html>
<html lang="zh-CN">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>听力音频</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
	<main class="container py-5" style="max-width: 720px;">

		<h1 class="h3 mt-4 mb-4">听力音频</h1>

		<form id="tts-form" data-create-url="{% url 'listening:job-create' %}">
			{% csrf_token %}
			<label for="text" class="form-label">英文文本</label>
			<textarea id="text" name="text" class="form-control mb-3" rows="6" required autofocus></textarea>
			<label for="voice" class="form-label">音色</label>
			<select id="voice" name="voice" class="form-select mb-3">
				{% for voice in voices %}
					<option value="{{ voice }}"{% if voice == default_voice %} selected{% endif %}>{{ voice }}</option>
				{% endfor %}
			</select>
			<label for="speed" class="form-label">
				语速：<span id="speed-value">1.0&times;</span>
			</label>
			<input
				type="range" id="speed" name="speed"
				class="form-range mb-3"
				min="0.5" max="2.0" step="0.1" value="1.0"
			>
			<button id="submit-button" type="submit" class="btn btn-primary w-100">生成</button>
		</form>

		<div id="status-message" class="alert mt-4 mb-0 d-none" role="status"></div>
		<audio id="audio-player" class="w-100 mt-4 d-none" controls preload="metadata"></audio>
	</main>

	<script src="{% static 'listening/audio.js' %}" defer></script>
</body>
</html>
